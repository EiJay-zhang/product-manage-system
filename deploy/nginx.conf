# 商品管理系统 Nginx
# 用法：复制到 /etc/nginx/conf.d/pms.conf
# 前端 dist 放到 /opt/pms/pms_web
# 后端 jar 监听 127.0.0.1:8080（不要把 8080 暴露到公网）
#
# 前端生产环境必须：
#   VUE_APP_BASE_API = '/prod-api'

server {
    listen       80;
    server_name  8.133.190.119;   # 有域名就改成域名，例如 pms.example.com

    charset utf-8;
    client_max_body_size 20m;     # 与 application.yml 中 max-request-size 一致

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain application/json application/javascript text/css application/xml text/javascript image/svg+xml;
    gzip_vary on;

    # ---------- 前端 Vue（history 模式）----------
    location / {
        root   /opt/pms/pms_web;
        try_files $uri $uri/ /index.html;
        index  index.html;
    }

    # 静态资源缓存；index.html 不缓存，避免发版后用户还用旧入口
    location = /index.html {
        root /opt/pms/pms_web;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        root /opt/pms/pms_web;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- 后端 API：/prod-api/xxx -> http://127.0.0.1:8080/xxx ----------
    # 末尾斜杠必须保留，用来去掉 /prod-api 前缀
    # ^~ 避免静态资源正则抢走 /prod-api 下的 js/png 请求
    location ^~ /prod-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # ---------- 上传文件（头像、附件）。前端一般走 /prod-api/profile/；直链 /profile/ 也转到后端 ----------
    location ^~ /profile/ {
        proxy_pass http://127.0.0.1:8080/profile/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 墨水屏设备（免登录，无 /prod-api 前缀也可打到后端）----------
    location ^~ /pms/eink/ {
        proxy_pass http://127.0.0.1:8080/pms/eink/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}

